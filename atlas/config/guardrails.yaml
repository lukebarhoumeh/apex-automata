account:
  equity_usd: 50000
  risk_per_trade: 0.01
  max_open_positions: 5
  max_account_leverage: 3.0
  min_notional_buffer: 1.1

risk:
  daily_loss_limit: -0.02
  weekly_loss_limit: -0.05
  max_drawdown_limit: -0.15
  max_position_exposure_pct: 0.75  # AGGRESSIVE: Allow larger positions for testing
  funding_cost_tolerance_bps: 20
  slippage_estimate_bps: 3

# Per-symbol risk limits and strategy parameter overrides
# Each symbol can have:
#   - max_notional_usd: Maximum position size in USD
#   - max_daily_loss_usd: Maximum daily loss before symbol is blocked
#   - strategy_overrides: Per-strategy parameter overrides for this symbol
#
# Strategy overrides allow different parameters for different volatility profiles:
#   - BTC: Lower volatility, tighter stops
#   - SOL: Higher volatility, wider stops and higher volume threshold
per_symbol:
  # AGGRESSIVE SETTINGS FOR TESTING
  BTC-USD:
    max_notional_usd: 50000  # TESTING: Very high limit
    max_daily_loss_usd: 5000
    strategy_overrides:
      breakout:
        atrMultiplier: 2.0
        volumeThreshold: 0.3      # Very low - any volume ok
        period: 8                 # Short lookback
      vwap_mr:
        deviationEntry: 0.1       # ULTRA AGGRESSIVE - any small deviation
      momentum:
        atrMultiplier: 2.0
        rsiOversold: 48           # Very close to neutral
        rsiOverbought: 52
  ETH-USD:
    max_notional_usd: 50000  # TESTING: Very high limit
    max_daily_loss_usd: 5000
    strategy_overrides:
      breakout:
        atrMultiplier: 2.0
        volumeThreshold: 0.3
        period: 8
      vwap_mr:
        deviationEntry: 0.1       # ULTRA AGGRESSIVE
      momentum:
        atrMultiplier: 2.0
        rsiOversold: 48
        rsiOverbought: 52
  SOL-USD:
    max_notional_usd: 50000  # TESTING: Very high limit
    max_daily_loss_usd: 5000
    strategy_overrides:
      breakout:
        atrMultiplier: 2.5
        volumeThreshold: 0.3
        period: 8
      vwap_mr:
        deviationEntry: 0.1       # ULTRA AGGRESSIVE
        maxDeviation: 10.0
      momentum:
        atrMultiplier: 2.5
        rsiOversold: 48
        rsiOverbought: 52

strategy:
  mode: momentum_futures
  donchian_len: 20
  ema_len_1h: 100
  atr_len_15m: 20
  atr_entry_band:
    - 0.0005
    - 0.05
  stop_init_atr: 1.5
  stop_trail_atr: 1.0
  time_stop_bars: 96
  # IMPORTANT: allow_short is false because Coinbase spot markets do not support shorting.
  # This is a PLATFORM LIMITATION, not a strategy choice.
  # - Strategies may still generate 'sell' signals for analytics/backtesting
  # - 'sell' on a long position = close position (valid)
  # - 'sell' on flat position = no action (cannot open short on Coinbase spot)
  # To enable shorting, use an exchange that supports margin/futures (e.g., Binance Futures, dYdX)
  allow_short: false
  trade_cooldown_min: 15

execution:
  order_type: marketable_limit
  price_offset_ticks: 2
  max_slippage_bps: 5
  order_timeout_sec: 5
  retry_backoff_ms:
    - 100
    - 500
    - 1000
    - 5000
    - 30000

circuit_breakers:
  rapid_loss_trigger: -0.02    # 2% of equity = $1000 (was $150 - way too tight)
  fill_rate_collapse: 0.1
  adverse_selection_spike: 0.6
  correlation_spike: 0.8
  vol_spike_atr: 0.03
  data_gap_sec: 30             # 30 seconds (was 2 - too aggressive)

filters:
  atr_volatility_min: 0.0005
  atr_volatility_max: 0.05
  funding_bias_enabled: true
  time_filter_enabled: true
  allowed_hours_utc:
    - 0
    - 23

compliance:
  tax_method: FIFO
  export_frequency_days: 7
  log_level: INFO
  audit_trail_enabled: true
  flatten_on_shutdown: true

ui:
  heartbeat_sec: 15
  show_pnl_per_symbol: true
  show_risk_status: true
  kill_switch_button: true
  alert_channels:
    - telegram
    - email

go_live_criteria:
  paper_parity_max_diff_bps: 20
  min_profitable_days: 3
  max_error_count_per_day: 0
  manual_approval_required: true

