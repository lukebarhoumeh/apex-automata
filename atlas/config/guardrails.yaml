account:
  # Paper-only starting equity. Live mode sizes from the Coinbase account
  # (LiveAccountTruth, see `live:` below) and refuses to start if that is unknown.
  equity_usd: 10000
  risk_per_trade: 0.005
  max_open_positions: 4
  max_account_leverage: 3.0
  min_notional_buffer: 1.1

# Single source of truth for exchange fee assumptions.
# Used by backtest / paper / live so all three are directly comparable.
# Values in basis points (1 bps = 0.01%). Sourced from public 2026 fee
# schedules — update here when tiers change; do NOT scatter constants in code.
#
# Sources:
#   coinbase.spot          — Coinbase Advanced Trade $10k–$50k volume tier
#                            (https://www.coinbase.com/advanced-fees)
#   coinbase.perps_intx    — Coinbase International Exchange perps default tier
#                            (https://www.coinbase.com/international-exchange-fees)
#   hyperliquid.perps      — Hyperliquid perps base tier; maker is a rebate
#                            (https://hyperliquid.gitbook.io/hyperliquid-docs/trading/fees)
fees:
  coinbase:
    spot:
      maker_bps: 25       # 0.25%
      taker_bps: 40       # 0.40%
    perps_intx:
      maker_bps: 0        # 0.00%
      taker_bps: 5        # 0.05%
  hyperliquid:
    perps:
      maker_bps: -1.5     # rebate (negative = paid to maker)
      taker_bps: 4.5      # 0.045%

# Strategies permanently disabled based on Phase 3 backtest verdict (March 2026)
# VWAP MR: Zero/1 trade across 12 months — ADX ranging regime too short
# Breakout: Negative-EV even at zero fees — signal has no edge
# See PHASE3_BACKTEST_VERDICT.md for full analysis
disabled_strategies:
  - vwap_mr
  - breakout

# Backtest realism model. Read by atlas/apps/core-node/src/backtesting/backtest-engine.ts
# to make backtest P&L comparable to paper/live behaviour. These knobs are
# documented in BacktestRealismConfig in the engine itself.
#
# - next_bar_fill: signals from candle[t] fill at candle[t+1].open (no look-ahead)
# - entry_slippage_bps: per-side slippage applied to entry fills
# - stop_overshoot_bar_range_pct: stop fills move (this fraction × bar range)
#   beyond the trigger to model gap/wick-through. 0.20 = 20% of bar range.
# - stop_overshoot_min_bps: floor on overshoot for low-volatility bars
backtest:
  next_bar_fill: true
  entry_slippage_bps: 5
  stop_overshoot_bar_range_pct: 0.20
  stop_overshoot_min_bps: 5

risk:
  daily_loss_limit: -0.02
  weekly_loss_limit: -0.05
  max_drawdown_limit: -0.15
  max_position_exposure_pct: 0.30
  funding_cost_tolerance_bps: 20
  slippage_estimate_bps: 3
  # A3 (2026-05-18): pre-trade fee-adjusted EV gate. Signals whose
  # expected USD value [p * (TP_R * size) - (1 - p) * (SL_R * size) -
  # 2 * fee * notional] is below this threshold are rejected at the
  # router. 0 = reject strictly negative-EV trades; raise to e.g. 0.50
  # to require a $0.50 minimum expected edge per trade. See
  # docs/research/2026-05-18_a1-hl-fee-aware-param-retune.md §5.4 and
  # docs/research/2026-05-18_f4-hl-backtest-validation.md §4.1.
  # Desk pin (2026-09-10): 0 for the first 30 paper days. TODO: raise to 1
  # (USD) once 30 days of paper EV data exist; an optional min_hold_bars gate
  # is a separate follow-up. Enforced by `pnpm check:config` (config-drift.ts).
  min_ev_threshold: 0

# Per-symbol risk limits and strategy parameter overrides
# Each symbol can have:
#   - max_notional_usd: Maximum position size in USD
#   - max_daily_loss_usd: Maximum daily loss before symbol is blocked
#   - strategy_overrides: Per-strategy parameter overrides for this symbol
#
# Strategy overrides allow different parameters for different volatility profiles:
#   - BTC: Lower volatility, tighter stops
#   - SOL: Higher volatility, wider stops and higher volume threshold
per_symbol:
  BTC-USD:
    max_notional_usd: 3000
    max_daily_loss_usd: 200
    strategy_overrides:
      breakout:
        atrMultiplier: 2.0
        volumeThreshold: 1.5
        period: 20
      vwap_mr:
        deviationEntry: 2.0
      momentum:
        atrMultiplier: 2.0
        rsiOversold: 30
        rsiOverbought: 70
      # Desk pin (2026-09-10): trend_follow runs on every symbol and had no
      # override here, so it fell through to the plugin default
      # takeProfitAtr=5.0 while every other symbol carries 2.5/6.0 (A1 HL
      # fee-floor retune). Pinned explicitly; `pnpm check:config`
      # fails if any symbol block loses this.
      trend_follow:
        stopAtr: 2.5
        takeProfitAtr: 6.0
  ETH-USD:
    max_notional_usd: 3000
    max_daily_loss_usd: 200
    strategy_overrides:
      trend_follow:
        emaFast: 12
        emaSlow: 15
        stopAtr: 2.5
        takeProfitAtr: 6.0
      momentum:
        # strategy-tuning: rsiOversold/rsiOverbought were 40/55 here, which
        # was the source of "RSI overbought at 56.5" SELL signals in the
        # live paper run. Restored to canonical 30/70.
        rsiPeriod: 10
        rsiOversold: 30
        rsiOverbought: 70
        macdFast: 8
        macdSlow: 21
        macdSignal: 5
        stopAtr: 2.0
        takeProfitAtr: 5.0
        atrMultiplier: 2.0
      breakout:
        atrMultiplier: 2.0
        volumeThreshold: 1.5
        period: 20
      vwap_mr:
        deviationEntry: 2.0
  SOL-USD:
    max_notional_usd: 3000
    max_daily_loss_usd: 200
    strategy_overrides:
      breakout:
        atrMultiplier: 2.5
        volumeThreshold: 1.5
        period: 20
      vwap_mr:
        deviationEntry: 2.0
        maxDeviation: 10.0
      momentum:
        atrMultiplier: 2.5
        rsiOversold: 30
        rsiOverbought: 70
      # Desk pin (2026-09-10) — same rationale as BTC-USD above.
      trend_follow:
        stopAtr: 2.5
        takeProfitAtr: 6.0

strategy:
  mode: momentum_futures
  donchian_len: 20
  ema_len_1h: 100
  atr_len_15m: 20
  atr_entry_band:
    - 0.0005
    - 0.05
  stop_init_atr: 1.5
  stop_trail_atr: 1.0
  time_stop_bars: 96
  # Shorting enabled via Coinbase Perpetual Futures (CFTC-regulated)
  # - Spot adapter ('coinbase'): shorts still blocked at execution level
  # - Perps adapter ('coinbase-perps'): full long/short capability
  # - Strategies generate both long and short signals
  allow_short: true
  # Desk pin: 15 — never <= 5. A 5-minute cooldown produced 2-5 minute
  # entry->exit round-trips that lost $370+ in fees alone before any edge
  # could show. Enforced by `pnpm check:config` (config-drift.ts).
  trade_cooldown_min: 15

# Momentum strategy (RSI/MACD) — single source of truth for the
# plugin's runtime parameters. The plugin file
# (atlas/apps/core-node/src/strategies/plugins/builtin/momentum-strategy.ts)
# defines the canonical defaults via configSchema; this block lets ops
# override them without redeploying. Per-symbol overrides under
# `per_symbol.<symbol>.strategy_overrides.momentum` still take precedence.
#
# strategy-tuning (2026-05): rsiOversold/rsiOverbought were 40/60 here,
# which drove "RSI overbought at 56.5" SELL emissions in paper. Restored
# to the industry-standard 30/70 thresholds documented in the plugin
# configSchema.
momentum:
  rsiPeriod: 14
  rsiOversold: 30
  rsiOverbought: 70
  macdFast: 12
  macdSlow: 26
  macdSignal: 9
  requireMacdConfirm: true
  requireMacdCrossover: false
  stopAtr: 2.0
  takeProfitAtr: 5.0

# Perpetual Futures Configuration
# Applies only when trading via 'coinbase-perps' adapter
perps:
  # Risk per trade for leveraged positions (1.5% approved — quarter-Kelly at leverage)
  risk_per_trade: 0.015
  # Default leverage for new positions (conservative start)
  default_leverage: 3
  # Maximum leverage allowed (Coinbase limit: 10x intraday)
  max_leverage: 10
  # Minimum distance from liquidation price before position is auto-reduced (%)
  liquidation_buffer_pct: 0.20
  # Maximum funding rate (bps) before position bias is applied
  max_funding_rate_bps: 50
  # Funding rate check interval (seconds)
  funding_check_interval_sec: 300
  # Fee schedule for perps (decimal format)
  # @deprecated 2026-05-18 — superseded by `fees.coinbase.perps_intx` (see top of file).
  # Still loaded into PerpsRiskMonitor for back-compat but never read in
  # `trading/perps/perps-risk-monitor.ts`. Safe to delete in a follow-up PR.
  maker_fee: 0.0000
  taker_fee: 0.0003
  # Contract specifications
  nano_contract_size: 0.01

# Per-symbol perpetual futures configuration
perps_symbols:
  ETH-PERP-INTX:
    max_notional_usd: 5000
    max_daily_loss_usd: 300
    default_leverage: 3
    max_leverage: 5
    # F4 follow-up §8 (2026-05-19): structurally disable momentum on this
    # 1-minute perp symbol. Empirical evidence (4eb1127 re-run): momentum
    # take_profit exit rate collapsed 6.8% -> 0% with the wider TP, WR
    # stayed at ~30%, and the strategy bled -$1,782 on 251 trades over the
    # HL 90d window. Disable saves the full per-trade fee+stop drag rather
    # than slowing it via wider TPs. Spot momentum (ETH-USD/BTC-USD/SOL-USD)
    # is unaffected. A6 (regime-conditional) can later relax this to
    # specific regimes once it lands; until then this is unconditional.
    disabled_strategies: [momentum]
    strategy_overrides:
      trend_follow:
        emaFast: 12
        emaSlow: 15
        stopAtr: 2.5
        takeProfitAtr: 6.0
      momentum:
        # strategy-tuning: was 40/55 — restored to canonical 30/70.
        rsiPeriod: 10
        rsiOversold: 30
        rsiOverbought: 70
        macdFast: 8
        macdSlow: 21
        macdSignal: 5
        stopAtr: 2.0
        # F4 follow-up (2026-05-19): lifted 5.0 -> 6.0 perps-only landing zone.
        # Empirical p_momentum_on_perps averages ~30% across F4 baseline + tune
        # runs; the +20% tune (TP 5.0 -> 6.0) empirically saved $1,682 on this
        # symbol (-$2,169 -> -$487 net) at the cost of 82% trade-count
        # reduction. Spot momentum takeProfitAtr stays at 5.0.
        # See docs/research/2026-05-19_f4-followup-perps-action.md.
        takeProfitAtr: 6.0
        atrMultiplier: 2.0
  BTC-PERP-INTX:
    max_notional_usd: 5000
    max_daily_loss_usd: 300
    default_leverage: 3
    max_leverage: 5
    # F4 follow-up §8 (2026-05-19): structurally disable momentum on this
    # 1-minute perp symbol — same rationale as ETH-PERP-INTX above. Empirical
    # bleed -$2,082 on 238 trades, WR ~29%. The momentum override block below
    # is kept (with its takeProfitAtr=6.0 from 4eb1127) so that re-enabling
    # via removing this list is a one-line undo without losing the calibration.
    disabled_strategies: [momentum]
    strategy_overrides:
      momentum:
        atrMultiplier: 2.0
        rsiOversold: 30
        rsiOverbought: 70
        # F4 follow-up (2026-05-19): perps-only landing zone — momentum on
        # BTC-PERP-INTX previously inherited the global momentum.takeProfitAtr
        # (5.0). Pinned to 6.0 here so spot stays at 5.0 while perps gets the
        # wider TP that empirically saved $1,719 on this symbol in F4 tune
        # (-$2,229 -> -$510 net).
        takeProfitAtr: 6.0
      trend_follow:
        emaFast: 12
        emaSlow: 26
        stopAtr: 2.5
        takeProfitAtr: 6.0

execution:
  order_type: marketable_limit
  price_offset_ticks: 2
  max_slippage_bps: 5
  order_timeout_sec: 5
  retry_backoff_ms:
    - 100
    - 500
    - 1000
    - 5000
    - 30000

circuit_breakers:
  rapid_loss_trigger: -0.02    # 2% of equity = $1000 (was $150 - way too tight)
  fill_rate_collapse: 0.1
  adverse_selection_spike: 0.6
  correlation_spike: 0.8
  vol_spike_atr: 0.03
  data_gap_sec: 30             # 30 seconds (was 2 - too aggressive)

# Meta-filter (rule-based trade quality) config. The MetaFilter class lives in
# atlas/apps/core-node/src/strategies/meta-filter.ts and uses zod-validated
# defaults for everything not specified here. Only fields with operational
# tuning value are surfaced to YAML.
#
# coindesk_sentiment: SOFT-WEIGHT-ONLY rule that nudges the meta quality score
# by a bounded delta based on CoinDesk news sentiment for the signal's base
# asset. Never blocks signals (no `allowed: false`). Default OFF — flip
# `enabled: true` to A/B test against the existing rule-based meta-filter.
# Free-tier API key sunsets 2026-05-21; verify tier before enabling.
meta_filter:
  coindesk_sentiment:
    enabled: false
    lookback_minutes: 60
    stale_threshold_ms: 1800000        # 30 min
    weight_delta_bounds: [-0.25, 0.25]
    cache_ttl_ms: 60000                # 60s in-memory cache (per symbol+lookback)
    request_timeout_ms: 5000
    rule_weight: 0.2                   # weight in averaged quality score
    enabled_symbols:
      - BTC-USD
      - ETH-USD
      - SOL-USD
      - ETH-PERP-INTX
      - BTC-PERP-INTX

filters:
  # Desk pin: 0.005 (0.5% ATR). H2 min-profitable-trade-size floor at HL fees
  # (docs/research/2026-05-14_min-trade-size-hl-fees.md §2); the previous
  # 0.0005 let sub-fee-floor chop through. Enforced by `pnpm check:config` (config-drift.ts).
  atr_volatility_min: 0.005
  atr_volatility_max: 0.05
  funding_bias_enabled: true
  # Time-of-day filter is OFF by default. The previous default
  # (time_filter_enabled: true with allowed_hours_utc: [0, 23]) was a no-op
  # because the gate interpreted [start, end] as a 24h range. The gate has
  # been rewritten to treat allowed_hours_utc as a literal list of allowed
  # UTC hours (so [13, 14, 15, 16, 17] would only allow signals during
  # those five hours). Set time_filter_enabled to true and provide a
  # specific list to restrict trading to chosen hours.
  time_filter_enabled: false
  allowed_hours_utc:
    - 0

# Live-mode runtime knobs (Sprint 9 / TASK_011). Paper mode never reads this block.
# In live mode equity, fee tier and product specs come from Coinbase via
# LiveAccountTruth (atlas/apps/core-node/src/trading/account/live-account-truth.ts);
# `account.equity_usd` above is paper-only and is NEVER used as a live fallback.
#
# - account_refresh_sec: refresh cadence for /accounts + /transaction_summary +
#   /products/{id}; also refreshed immediately after every fill. A snapshot older
#   than 3x this interval marks the adapter degraded and blocks new entries
#   (ACCOUNT_TRUTH_STALE).
# - min_quote_usd: live preflight FAILs when USD+USDC available is below this.
# - ev_gate_mode: enforce | shadow. `shadow` never blocks; it logs
#   EV_GATE_SHADOW_ALLOW for every would-be reject and prints a startup banner.
#   Only a live profile (TASK_012, Door B) should ever set `shadow`.
live:
  account_refresh_sec: 60
  min_quote_usd: 20
  ev_gate_mode: enforce

# A6 (2026-05-29) — Regime-conditional gates. DISABLED BY DEFAULT.
# ---------------------------------------------------------------------------
# Live/paper behaviour is UNCHANGED while `enabled: false` (the gate is a
# no-op). Flip `enabled: true` ONLY after a human reviews the trade-count vs
# edge trade-off in docs/research/2026-05-29_a6-regime-conditional-gates.md.
# To MEASURE projected impact in a backtest WITHOUT changing this default:
#   pnpm backtest --regime-conditional-gates --start-date <s> --end-date <e> --products <...>
# (NB: the backtest CLI's `--regime-gates on|off` is the unrelated RegimeFilter
# compatibility toggle from TASK_017 — it does NOT read this block.)
#
# Mechanism: each rule blocks `strategy` signals when the CONFIDENTLY-classified
# regime (signal.metadata.regime, stamped by RegimeFilter / the strategy plugin)
# is in `block_regimes`. Optional `venues` ([spot]|[PERP]) and `symbols` narrow
# a rule. Low-confidence signals (no stamped regime) are never gated. Composes
# ON TOP OF the plugin-level regimeCompatibility gate (which already refuses
# trend_follow in ranging/choppy) and the RegimeFilter — it is strictly
# additive, never a relaxation.
#
# Empirical basis (8fea8b1 backtests, HL 4.5bps): trend_follow bleeds in
# weak_trend — PF 0.78 (90d, n=143) and PF 0.80 (12m, n=405) — and only shows
# positive edge in strong_trend (PF 1.41, 12m, n=16). Blocking weak_trend keeps
# only the strong_trend edge. CAVEAT: strong_trend is rare, so this nearly
# silences trend_follow — read the doc's §"projected impact" before enabling.
# Momentum is intentionally NOT gated here: its regime edge is NOT stationary
# (strong_trend PF 3.73 over 90d vs 0.46 over 12m), so a momentum regime gate
# would overfit to one window.
regime_gates:
  enabled: false
  rules:
    - strategy: trend_follow
      block_regimes: [weak_trend]

compliance:
  tax_method: FIFO
  export_frequency_days: 7
  log_level: INFO
  audit_trail_enabled: true
  flatten_on_shutdown: true

ui:
  heartbeat_sec: 15
  show_pnl_per_symbol: true
  show_risk_status: true
  kill_switch_button: true
  alert_channels:
    - telegram
    - email

go_live_criteria:
  paper_parity_max_diff_bps: 20
  min_profitable_days: 3
  max_error_count_per_day: 0
  manual_approval_required: true

# Hyperliquid Perpetual Futures Configuration
# Applies when trading via the 'hyperliquid' adapter (atlas/apps/core-node/src/exchanges/hyperliquid).
#
# KILL SWITCH — TWO LOCKS, BOTH MUST BE OPEN:
#   1. `enabled: true` here in this YAML block
#   2. `HYPERLIQUID_ENABLED=true` in the process env
#
# Default is `enabled: false` so the adapter stays inert (registered but never
# initialized) on every startup until both locks are explicitly opened. No live
# HL orders can be placed by the engine until signal routing is wired in a
# separate PR — right now this block only governs whether the adapter connects.
#
# Credentials (HYPERLIQUID_PRIVATE_KEY, HYPERLIQUID_WALLET_ADDRESS) come from
# env only and are never logged. testnet: true keeps everything on Hyperliquid's
# testnet endpoints.
hyperliquid:
  enabled: false       # KILL SWITCH — must be true AND HYPERLIQUID_ENABLED=true to activate
  testnet: true        # mainnet=false; only flip after credentials + routing are verified
  risk_per_trade: 0.03
  default_leverage: 3
  max_leverage: 5
  # @deprecated 2026-05-18 — superseded by `fees.hyperliquid.perps` (see top of file).
  # Loaded by `loadGuardrails.ts` but has zero read sites in `atlas/apps/core-node/src`.
  # Note: legacy values here also LOST the maker rebate sign (true value: -1.5 bps).
  # Safe to delete in a follow-up PR.
  maker_fee: 0.0002
  taker_fee: 0.0005
  funding_check_interval_sec: 300

# Per-symbol Hyperliquid configuration
hyperliquid_symbols:
  ETH-USD:
    max_notional_usd: 3000
    max_daily_loss_usd: 200
    strategy_overrides:
      trend_follow:
        emaFast: 12
        emaSlow: 15
        stopAtr: 2.5
        takeProfitAtr: 6.0
      momentum:
        # strategy-tuning: was 40/55 — restored to canonical 30/70.
        rsiPeriod: 10
        rsiOversold: 30
        rsiOverbought: 70
        macdFast: 8
        macdSlow: 21
        macdSignal: 5
        stopAtr: 2.0
        takeProfitAtr: 5.0
  BTC-USD:
    max_notional_usd: 3000
    max_daily_loss_usd: 200
    strategy_overrides:
      trend_follow:
        emaFast: 12
        emaSlow: 26
        stopAtr: 2.5
        takeProfitAtr: 6.0

