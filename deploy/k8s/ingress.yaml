apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlas-ingress
  namespace: atlas-bot
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "atlas-api"
    # Uncomment for TLS/SSL
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  # Uncomment for TLS/SSL
  # tls:
  #   - hosts:
  #       - atlas.yourdomain.com
  #     secretName: atlas-tls
  rules:
    - host: atlas.yourdomain.com  # Update with your domain
      http:
        paths:
          # Frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atlas-web
                port:
                  number: 80
          # API
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: atlas-api
                port:
                  number: 3001
          # WebSocket
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: atlas-api
                port:
                  number: 3001
